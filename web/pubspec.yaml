name: bipa_web
description: "Bipa — lista de supermercado com leitura de código de barras"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  get: ^4.6.6
  http: ^1.1.0
  intl: any
  jwt_decoder: ^2.0.1
  shared_preferences: ^2.5.3
  # Banco local em IndexedDB — o app precisa funcionar com a lista inteira
  # sem conexão, e SharedPreferences não dá conta disso.
  sembast: ^3.7.0
  sembast_web: ^2.4.0
  # UUID v7 gerado no aparelho: o id nasce definitivo mesmo offline.
  uuid: ^4.5.1
  # Interop com a API BarcodeDetector do navegador.
  web: ^1.1.0
  # O GetX referencia CupertinoIcons; sem o pacote os glifos somem.
  cupertino_icons: ^1.0.8
  mobile_scanner: ^7.4.0
  path_provider: ^2.1.6
  path: ^1.9.1
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
